<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majestic Hotel - AI Chatbot Widget</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --accent-color: #d97706;
            --bg-color: #f8fafc;
            --text-color: #0f172a;
        }

        /* Floating Chat Button */
        .chatbot-toggler {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.4);
            border: none;
            z-index: 9999;
            transition: transform 0.3s ease, background 0.3s;
        }

        .chatbot-toggler:hover {
            transform: scale(1.08);
            background: #1e40af;
        }

        .chatbot-toggler i {
            font-size: 26px;
        }

        /* Chat Window */
        .chatbot-container {
            position: fixed;
            bottom: 100px;
            left: 30px;
            width: 380px;
            max-width: calc(100vw - 40px);
            height: 540px;
            max-height: calc(100vh - 120px);
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .chatbot-container.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
        }

        .chat-header-info h4 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .chat-header-info p {
            margin: 2px 0 0 0;
            font-size: 12px;
            opacity: 0.85;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        /* Messages Box */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #f8fafc;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
        }

        .message.user {
            align-self: flex-start; /* RTL: left */
            flex-direction: row-reverse;
            margin-right: auto;
        }

        .message.bot {
            align-self: flex-end; /* RTL: right */
            margin-left: auto;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: var(--primary-color);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.bot .message-content {
            background: #ffffff;
            color: var(--text-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border-bottom-left-radius: 2px;
        }

        /* Quick Suggestion Chips */
        .suggestion-chips {
            display: flex;
            gap: 8px;
            padding: 10px 15px;
            overflow-x: auto;
            background: #fff;
            border-top: 1px solid #e2e8f0;
        }

        .chip {
            background: #eff6ff;
            color: var(--primary-color);
            border: 1px solid #bfdbfe;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .chip:hover {
            background: #dbeafe;
        }

        /* Input Footer */
        .chat-input-container {
            padding: 14px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            direction: rtl;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--primary-color);
        }

        .send-btn {
            background: var(--primary-color);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>

    <!-- Floating Trigger Button -->
    <button class="chatbot-toggler" id="chatbotToggler">
        <i class="fa-solid fa-comments"></i>
    </button>

    <!-- Chat Widget Container -->
    <div class="chatbot-container" id="chatbotContainer">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-info">
                <i class="fa-solid fa-hotel" style="font-size: 24px;"></i>
                <div>
                    <h4>فندق ماجيستك - المساعد الذكي</h4>
                    <p>متصل الآن لخدمتك 24/7</p>
                </div>
            </div>
            <button class="close-btn" id="closeBtn">&times;</button>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">أهلاً بك في فندق ماجيستك! 🏨
كيف يمكنني مساعدتك اليوم في استفسارات الغرف، الأسعار، أو إتمام حجز جديد؟</div>
            </div>
        </div>

        <!-- Quick Chips -->
        <div class="suggestion-chips">
            <button class="chip" onclick="sendQuickMessage('ما هي الغرف المتاحة حالياً؟')">الغرف المتاحة</button>
            <button class="chip" onclick="sendQuickMessage('حساب حجز 2 كبار و 2 أطفال')">حجز عائلي</button>
            <button class="chip" onclick="sendQuickMessage('ما هي العروض والخصومات الفعالة؟')">العروض والخصومات</button>
        </div>

        <!-- Input Box -->
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // 🛑 ضع رابط n8n Webhook URL الخاص بك هنا:
        const N8N_WEBHOOK_URL = 'https://YOUR_N8N_INSTANCE_URL/webhook/YOUR_CHAT_WEBHOOK_PATH';

        const toggler = document.getElementById('chatbotToggler');
        const container = document.getElementById('chatbotContainer');
        const closeBtn = document.getElementById('closeBtn');
        const messagesBox = document.getElementById('chatMessages');
        const inputField = document.getElementById('chatInput');

        toggler.addEventListener('click', () => container.classList.toggle('active'));
        closeBtn.addEventListener('click', () => container.classList.remove('active'));

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            msgDiv.appendChild(contentDiv);
            messagesBox.appendChild(msgDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage('user', text);
            inputField.value = '';

            // Loading indicator
            appendMessage('bot', 'جاري التفكير وحساب الإجابة...');
            const loadingMsg = messagesBox.lastElementChild;

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatInput: text, action: 'sendMessage' })
                });
                
                const data = await response.json();
                loadingMsg.remove();

                const replyText = data.output || data.text || data.response || 'تم استقبال طلبك بنجاح!';
                appendMessage('bot', replyText);
            } catch (err) {
                loadingMsg.remove();
                appendMessage('bot', 'شكراً لتواصلك! أهلاً بك في فندق ماجيستك، تسعدنا خدمتك دائماً.');
            }
        }

        function sendQuickMessage(text) {
            inputField.value = text;
            sendMessage();
        }
    </script>

</body>
</html>
