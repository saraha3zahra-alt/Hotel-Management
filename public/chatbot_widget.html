<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فندق ماجيستك - المساعد الذكي</title>
    <!-- 🤖 كود شات بوت فندق ماجيستك العائم -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chatbot-toggler {
            position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px;
            background: #1e3a8a; color: #fff; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.4); border: none; z-index: 9999;
            transition: transform 0.3s ease;
        }
        .chatbot-toggler:hover { transform: scale(1.08); background: #1e40af; }
        .chatbot-toggler i { font-size: 26px; }

        .chatbot-container {
            position: fixed; bottom: 100px; left: 30px; width: 380px; max-width: calc(100vw - 40px);
            height: 520px; max-height: calc(100vh - 120px); background: #ffffff;
            border-radius: 16px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            display: flex; flex-direction: column; overflow: hidden; z-index: 9998;
            opacity: 0; pointer-events: none; transform: translateY(20px); transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl;
        }
        .chatbot-container.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .chat-header { background: linear-gradient(135deg, #1e3a8a, #1d4ed8); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
        .chat-header h4 { margin: 0; font-size: 16px; }
        .chat-header p { margin: 2px 0 0; font-size: 12px; opacity: 0.85; }
        .close-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }

        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
        .message { display: flex; max-width: 85%; }
        .message.user { align-self: flex-start; }
        .message.bot { align-self: flex-end; }
        .message-content { padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .message.user .message-content { background: #1e3a8a; color: #fff; }
        .message.bot .message-content { background: #fff; color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

        .suggestion-chips { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; background: #fff; border-top: 1px solid #e2e8f0; }
        .chip { background: #eff6ff; color: #1e3a8a; border: 1px solid #bfdbfe; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }

        .chat-input-container { padding: 12px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
        .chat-input { flex: 1; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 24px; font-size: 14px; outline: none; direction: rtl; }
        .send-btn { background: #1e3a8a; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <button class="chatbot-toggler" id="chatbotToggler"><i class="fa-solid fa-comments"></i></button>

    <div class="chatbot-container" id="chatbotContainer">
        <div class="chat-header">
            <div>
                <h4>🏨 فندق ماجيستك - المساعد الذكي</h4>
                <p>متصل الآن لخدمتك 24/7</p>
            </div>
            <button class="close-btn" id="closeBtn">&times;</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">أهلاً بك في فندق ماجيستك! 🏨
كيف يمكنني مساعدتك اليوم في استفسارات الغرف والأسعار والإحصائيات؟</div>
            </div>
        </div>
        <div class="suggestion-chips">
            <button class="chip" onclick="sendQuickMessage('ما هي الغرف المتاحة حالياً؟')">الغرف المتاحة</button>
            <button class="chip" onclick="sendQuickMessage('حساب حجز 2 كبار و 2 أطفال من 2026-10-10 إلى 2026-10-20')">حجز عائلي</button>
        </div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // 🔗 رابط الـ n8n Webhook الخاص بك المربوط مباشرةً:
        const N8N_WEBHOOK_URL = 'https://sarahhassan22.app.n8n.cloud/webhook/0d87b81b-46b0-4f68-9731-63f454648888/chat';

        const toggler = document.getElementById('chatbotToggler');
        const container = document.getElementById('chatbotContainer');
        const closeBtn = document.getElementById('closeBtn');
        const messagesBox = document.getElementById('chatMessages');
        const inputField = document.getElementById('chatInput');

        toggler.addEventListener('click', () => container.classList.toggle('active'));
        closeBtn.addEventListener('click', () => container.classList.remove('active'));

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            msgDiv.appendChild(contentDiv);
            messagesBox.appendChild(msgDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage('user', text);
            inputField.value = '';
            appendMessage('bot', 'جاري التواصل وحساب التوافر والأسعار...');
            const loadingMsg = messagesBox.lastElementChild;

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatInput: text, action: 'sendMessage' })
                });
                const data = await response.json();
                loadingMsg.remove();
                const reply = data.output || data.text || data.response || 'تم الاستعلام بنجاح!';
                appendMessage('bot', reply);
            } catch (err) {
                loadingMsg.remove();
                appendMessage('bot', 'أهلاً بك في فندق ماجيستك، تسعدنا خدمتك دائماً!');
            }
        }

        function sendQuickMessage(text) {
            inputField.value = text;
            sendMessage();
        }
    </script>
</body>
</html>
